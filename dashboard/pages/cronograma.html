<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cronograma de Estudos - ALE-RR</title>
    <link rel="manifest" href="../manifest.json"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border: #334155;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent),
                radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.05), transparent);
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover { background: var(--border); transform: translateY(-50%) translateX(-5px); }

        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Tabs/Weeks */
        .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .tab-btn {
            padding: 12px 30px;
            border-radius: 15px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }

        /* Timeline/Grid */
        .week-container { display: none; }
        .week-container.active { display: block; animation: fadeIn 0.5s ease-out; }

        .day-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .day-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            transition: 0.3s;
            position: relative;
        }
        .day-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .day-card.completed { border-color: var(--success); opacity: 0.8; }
        .day-card.completed::after {
            content: '\f058';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--success);
            font-size: 1.5rem;
        }

        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .day-number { font-size: 0.9rem; text-transform: uppercase; color: var(--primary); font-weight: 700; letter-spacing: 1px; }
        
        .study-block { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
        .block-title { font-size: 0.8rem; text-transform: uppercase; color: var(--secondary); font-weight: 700; margin-bottom: 8px; display: block; }
        .theme { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; display: block; }
        .subtopics { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 10px; }

        .meta { display: flex; gap: 15px; font-size: 0.8rem; }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        .meta-item i { color: var(--primary); }

        .check-day {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .check-day:hover { background: var(--success); color: white; }
        .completed .check-day { background: var(--success); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            margin-bottom: 30px;
        }
        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .navbar-inner::-webkit-scrollbar { display: none; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;
            color: #94a3b8;
        }
        .nav-link:hover { color: #f8fafc; border-bottom-color: var(--primary); }
        .nav-link.active { color: var(--primary); border-bottom-color: var(--primary); }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .navbar { padding: 0 10px; }
            .nav-link { padding: 12px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-inner">
        <a href="../index.html" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="gerais.html" class="nav-link"><i class="fa-solid fa-book"></i> Conhecimentos Gerais</a>
        <a href="especificos.html" class="nav-link"><i class="fa-solid fa-shield-halved"></i> Conhecimentos Específicos</a>
        <a href="cronograma.html" class="nav-link active"><i class="fa-solid fa-calendar-days"></i> Cronograma</a>
        <a href="microaprendizado.html" class="nav-link"><i class="fa-solid fa-brain"></i> Microaprendizado</a>
        <a href="dicas.html" class="nav-link"><i class="fa-solid fa-lightbulb"></i> Dicas</a>
    </div>
</nav>

<div class="container">
    <header>
        <h1>Cronograma de Estudos</h1>
        <p>Acompanhe sua jornada dia a dia até a aprovação.</p>
        <div style="margin-top: 20px;">
            <a href="dicas.html" style="color: var(--success); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
                <i class="fas fa-lightbulb"></i> Ver Dicas de Estudos
            </a>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="showWeek(1)">Semana 1</button>
        <button class="tab-btn" onclick="showWeek(2)">Semana 2</button>
        <button class="tab-btn" onclick="showWeek(3)">Semana 3</button>
        <button class="tab-btn" onclick="showWeek(4)">Semana 4</button>
    </div>

    <!-- Export Button -->
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="exportSchedule()" style="padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;">
            <i class="fas fa-download"></i> Exportar Cronograma (Texto)
        </button>
    </div>

    <!-- Semana 1 -->
    <div id="week1" class="week-container active">
        <div class="day-grid" id="grid-week-1"></div>
    </div>

    <!-- Semana 2 -->
    <div id="week2" class="week-container">
        <div class="day-grid" id="grid-week-2"></div>
    </div>

    <!-- Semana 3 -->
    <div id="week3" class="week-container">
        <div class="day-grid" id="grid-week-3"></div>
    </div>

    <!-- Semana 4 -->
    <div id="week4" class="week-container">
        <div class="day-grid" id="grid-week-4"></div>
    </div>
</div>

<script>
    const dataWeek1 = [
        { day: 1, espec: { theme: 'CID + Autenticidade', sub: 'Confidencialidade, Integridade, Disponibilidade, Não-repúdio' }, geral: { theme: 'Interpretação de Textos', sub: 'Compreensão vs. Inferência' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 2, espec: { theme: 'Ameaça x Vulnerabilidade x Risco', sub: 'Classificação, exemplos práticos FCC' }, geral: { theme: 'Reescrita de Frases', sub: 'Substituição sem alterar sentido + conectivos' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 3, espec: { theme: 'ISO 27001/27005', sub: 'Política de segurança, análise de risco' }, geral: { theme: 'Concordância Verbal/Nominal', sub: 'Casos clássicos FCC ("a maioria dos...")' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 4, espec: { theme: 'LGPD - Princípios', sub: 'Finalidade, adequação, transparência' }, geral: { theme: 'Pontuação + Crase', sub: 'Vírgula em orações intercaladas + crase' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 5, espec: { theme: 'LGPD - Bases Legais', sub: 'Consentimento, legítimo interesse' }, geral: { theme: 'Regência + Conectivos', sub: 'Verbos que mudam sentido + conjunções' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 6, espec: { theme: 'Criptografia Simétrica/Assimétrica', sub: 'AES, RSA, chaves públicas/privadas' }, geral: { theme: 'CF/88: Direitos Fundamentais', sub: 'Art. 5º + Direitos Políticos' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 7, espec: { theme: 'Hash + Assinatura Digital + PKI', sub: 'SHA, MD5, certificado digital, ICP-Brasil' }, geral: { theme: 'CF/88: Org. Estado', sub: 'Competências União/Estados/Municípios' }, q: 'Revisão Geral', rev: 'Semanal (1h)' }
    ];

    const dataWeek2 = [
        { day: 8, espec: { theme: 'IAM + RBAC + MFA', sub: 'Modelo de papéis, autenticação multifator' }, geral: { theme: 'Licitações: Modalidades', sub: 'Diferenças práticas + valores limites' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 9, espec: { theme: 'SSO + OAuth 2.0 + OpenID', sub: 'Fluxos, tokens, diferenças práticas' }, geral: { theme: 'Contratos Administrativos', sub: 'Cláusulas exorbitantes, alteração unilateral' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 10, espec: { theme: 'Redes: LAN/WAN + Protocolos', sub: 'TCP/IP, DNS, DHCP, HTTP/S' }, geral: { theme: 'Atos Administrativos', sub: 'Requisitos + Atributos' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 11, espec: { theme: 'Firewall + IDS/IPS', sub: 'Stateful vs Stateless, assinaturas' }, geral: { theme: 'Poderes Administrativos', sub: 'Hierárquico, Disciplinar, Polícia' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 12, espec: { theme: 'VPN + DMZ + NAC', sub: 'Túneis, zonas de segurança' }, geral: { theme: 'Agentes Públicos + Lei 8.112', sub: 'Cargo/Emprego, acumulação, estágio' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 13, espec: { theme: 'Protocolos Seguros (TLS, SSH)', sub: 'Handshake, certificados, trânsito' }, geral: { theme: 'Responsabilidade Civil + Improbid.', sub: 'Risco Adm + Lei 8.429/92' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 14, espec: { theme: 'SIMULADO SEMANAL', sub: '60 questões mistas (Semana 1+2)' }, geral: { theme: 'SIMULADO SEMANAL', sub: '60 questões (Português + Admin)' }, q: '120 FCC Total', rev: 'Semanal (2h)' }
    ];

    const dataWeek3 = [
        { day: 15, espec: { theme: 'SIEM + Gestão de Logs', sub: 'Correlação, retenção, análise forense' }, geral: { theme: 'PPA / LDO / LOA: Diferenças + Prazos', sub: 'Vigência, conteúdo, iniciativa legislativa' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 16, espec: { theme: 'Resposta a Incidentes (NIST/ISO)', sub: 'Preparação, detecção, contenção, erradicação, recuperação' }, geral: { theme: 'Classificação da Despesa Orçamentária', sub: 'Categoria econômica, grupo, elemento, subelemento' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 17, espec: { theme: 'Gestão de Vulnerabilidades', sub: 'Scan, priorização (CVSS), patch management' }, geral: { theme: 'Princípios Orçamentários + LRF', sub: 'Unidade, universalidade, anualidade + limites de pessoal' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 18, espec: { theme: 'Hardening + Segurança em OS/DB', sub: 'CIS Benchmarks, desabilitação de serviços, princípio do menor privilégio' }, geral: { theme: 'Constituição Estadual RR (arts. 30-67)', sub: 'Organização dos Poderes + competências da ALE/RR' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 19, espec: { theme: 'OWASP Top 10 (2021)', sub: 'Injection, Broken Auth, Sensitive Data Exposure, XSS' }, geral: { theme: 'Regimento Interno ALE/RR + Processo Legislativo', sub: 'Tramitação de projetos + comissões + CPI' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 20, espec: { theme: 'Segurança de APIs + JWT', sub: 'OAuth scopes, rate limiting, validação de entrada' }, geral: { theme: 'Código de Ética Parlamentar + Resolução 015/2024', sub: 'Deveres, vedações, estrutura administrativa' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 21, espec: { theme: 'SIMULADO SEMANAL', sub: '60 questões mistas (Semana 1-3) + correção' }, geral: { theme: 'SIMULADO SEMANAL', sub: '60 questões (AFO + Legislação RR) + correção' }, q: '120 FCC Total', rev: 'Semanal (1h)' }
    ];

    const dataWeek4 = [
        { day: 22, espec: { theme: 'Cloud: Modelo de Responsabilidade Compartilhada', sub: 'IaaS/PaaS/SaaS, quem protege o quê' }, geral: { theme: 'Geografia/História RR: Ocupação + Fronteiras', sub: 'Presença portuguesa, criação do Território Federal' }, q: '30+30 FCC', rev: 'Flashcards' },
        { day: 23, espec: { theme: 'Segurança em Cloud (AWS/Azure/GCP)', sub: 'IAM cloud, KMS, Security Groups, WAF' }, geral: { theme: 'Povos Indígenas + Economia de RR', sub: 'Terras indígenas, extrativismo, mineração' }, q: '30+30 FCC', rev: 'Mapas Mentais' },
        { day: 24, espec: { theme: 'Backup + RPO + RTO + Tipos de Recuperação', sub: 'Full/incremental/diferencial, teste de restore' }, geral: { theme: 'LGPD (Lei 13.709/18) + Aplicação no Legislativo', sub: 'Princípios, bases legais, direitos do titular' }, q: '30+30 FCC', rev: 'Erros do dia' },
        { day: 25, espec: { theme: 'Auditoria + Logging + Conformidade', sub: 'Trilhas de auditoria, imutabilidade, LGPD art. 46' }, geral: { theme: 'Revisão Ativa: Português + Administrativo', sub: 'Releitura de mapas + flashcards + erros acumulados' }, q: '30 FCC', rev: 'Flashcards' },
        { day: 26, espec: { theme: 'Contratações de TI: ETP + TR', sub: 'Elementos essenciais, matriz de riscos, SLA técnico' }, geral: { theme: 'Revisão Ativa: AFO + Legislação RR', sub: 'Foco em classificações, prazos, competências' }, q: '30 FCC', rev: 'Mapas Mentais' },
        { day: 27, espec: { theme: 'SLA + RACI + Governança', sub: 'Indicadores, papéis e responsabilidades, monitoramento' }, geral: { theme: 'Treino de Redação / Discursiva (se houver)', sub: 'Estrutura FCC: introdução + 2 argumentos + conclusão' }, q: '1 texto', rev: 'Erros do dia' },
        { day: 28, espec: { theme: 'REVISÃO GERAL ATIVA', sub: 'Releitura de mapas + flashcards + erros acumulados' }, geral: { theme: 'Simulado Parcial', sub: '45 questões mistas (todas as matérias) cronometradas' }, q: '45 FCC', rev: 'Semanal (2h)' }
    ];

    function createDayCard(dayData) {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.id = `day-${dayData.day}`;
        
        card.innerHTML = `
            <div class="day-header">
                <span class="day-number">Dia ${dayData.day}</span>
            </div>
            <div class="study-block">
                <span class="block-title">📚 Específicos</span>
                <span class="theme">${dayData.espec.theme}</span>
                <span class="subtopics">${dayData.espec.sub}</span>
            </div>
            <div class="study-block">
                <span class="block-title">📖 Gerais</span>
                <span class="theme">${dayData.geral.theme}</span>
                <span class="subtopics">${dayData.geral.sub}</span>
            </div>
            <div class="meta">
                <div class="meta-item"><i class="fas fa-pen-nib"></i> ${dayData.q}</div>
                <div class="meta-item"><i class="fas fa-sync"></i> ${dayData.rev}</div>
            </div>
            <button class="check-day" onclick="toggleDay(${dayData.day})">
                <i class="fas fa-check"></i> <span class="check-text">Marcar como Feito</span>
            </button>
        `;
        return card;
    }

    function renderGrids() {
        const grid1 = document.getElementById('grid-week-1');
        const grid2 = document.getElementById('grid-week-2');
        const grid3 = document.getElementById('grid-week-3');
        const grid4 = document.getElementById('grid-week-4');
        dataWeek1.forEach(d => grid1.appendChild(createDayCard(d)));
        dataWeek2.forEach(d => grid2.appendChild(createDayCard(d)));
        dataWeek3.forEach(d => grid3.appendChild(createDayCard(d)));
        dataWeek4.forEach(d => grid4.appendChild(createDayCard(d)));
    }

    function showWeek(n) {
        document.querySelectorAll('.week-container').forEach(w => w.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`week${n}`).classList.add('active');
        document.querySelectorAll('.tab-btn')[n-1].classList.add('active');
    }

    function toggleDay(day) {
        const card = document.getElementById(`day-${day}`);
        card.classList.toggle('completed');
        const btnText = card.querySelector('.check-text');
        if (card.classList.contains('completed')) {
            btnText.innerText = 'Dia Concluído!';
        } else {
            btnText.innerText = 'Marcar como Feito';
        }
        saveProgress();
        checkWeekCompletion(day);
    }

    function checkWeekCompletion(day) {
        const week = Math.ceil(day / 7);
        const weekDays = Array.from({length: 7}, (_, i) => `day-${(week-1)*7 + i + 1}`);
        const completedDays = weekDays.filter(id => document.getElementById(id)?.classList.contains('completed')).length;
        if (completedDays === 7) {
            setTimeout(() => {
                alert(`🏆 Parabéns! Você completou a Semana ${week}! Continue assim!`);
            }, 500);
        }
    }

    function saveProgress() {
        const completed = [];
        document.querySelectorAll('.day-card.completed').forEach(c => {
            completed.push(c.id);
        });
        localStorage.setItem('alerr_cronograma_progress', JSON.stringify(completed));
    }

    function loadProgress() {
        const completed = JSON.parse(localStorage.getItem('alerr_cronograma_progress')) || [];
        completed.forEach(id => {
            const card = document.getElementById(id);
            if (card) {
                card.classList.add('completed');
                card.querySelector('.check-text').innerText = 'Dia Concluído!';
            }
        });
    }

    function exportSchedule() {
        let scheduleText = "Cronograma de Estudos ALE-RR\n\n";
        const allData = [...dataWeek1, ...dataWeek2, ...dataWeek3, ...dataWeek4];
        allData.forEach(day => {
            scheduleText += `Dia ${day.day}: ${day.espec.theme} (${day.espec.sub})\n`;
            scheduleText += `Geral: ${day.geral.theme} (${day.geral.sub})\n`;
            scheduleText += `Questões: ${day.q} | Revisão: ${day.rev}\n\n`;
        });
        navigator.clipboard.writeText(scheduleText).then(() => {
            alert('Cronograma copiado para a área de transferência! Cole em um calendário ou documento.');
        });
    }

    renderGrids();
    loadProgress();
</script>

<!-- Register Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js')
      .then(registration => {
        console.log('Service Worker registrado com sucesso:', registration);
      })
      .catch(error => {
        console.log('Falha ao registrar Service Worker:', error);
      });
  });
}
</script>

</body>
</html>
