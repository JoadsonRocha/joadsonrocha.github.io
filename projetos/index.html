<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos • Joadson Rocha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 4rem 5%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 3rem;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .project-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            background: rgba(30, 41, 59, 0.9);
        }

        .project-icon {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .project-card h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .project-card p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .back-link {
            margin-top: 4rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <h1>Nossos Projetos</h1>

    <div class="projects-grid">
        <a href="lumina/index.html" class="project-card">
            <div class="project-icon"><i class="fas fa-play-circle"></i></div>
            <h2>Lumina Presentation</h2>
            <p>Visualizador e apresentador de imagens de alta performance com modo projeção e design premium.</p>
        </a>

        <!-- Placeholder for future projects -->
        <div class="project-card" style="opacity: 0.5; cursor: default;">
            <div class="project-icon"><i class="fas fa-plus"></i></div>
            <h2>Em breve</h2>
            <p>Mais ferramentas desktop de alta performance estão sendo preparadas.</p>
        </div>
    </div>

    <a href="../index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Voltar ao Portfólio
    </a>

</body>
</html>
